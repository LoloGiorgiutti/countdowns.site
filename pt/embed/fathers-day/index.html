<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia dos Pais — countdowns.site</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
:root{--cat:#4ADE80;--cat-glow:rgba(74,222,128,.2);--cat-soft:rgba(74,222,128,.08);}
</style>
</head>
<body>
<div id="root"></div>
<script src="/countdown-engine.js"></script>
<script>
(function() {
  var VARIANTS = [{"code": "us", "label": "US, Canada, UK & Mexico", "dates": ["2026-06-21", "2027-06-20"], "countries": ["US", "CA", "GB", "IE", "MX", "IN", "ZA", "SG"]}, {"code": "au", "label": "Australia & New Zealand", "dates": ["2026-09-06", "2027-09-05"], "countries": ["AU", "NZ"]}, {"code": "de", "label": "Germany & Austria", "dates": ["2026-05-14", "2027-05-06"], "countries": ["DE", "AT"]}, {"code": "br", "label": "Brasil / Brazil", "dates": ["2026-08-09", "2027-08-08"], "countries": ["BR", "PT"]}, {"code": "fr", "label": "France", "dates": ["2026-06-21", "2027-06-20"], "countries": ["FR", "BE", "LU", "CH"]}];
  var DEFAULT_IDX = 3;
  var _cfg = {
    slug: "fathers-day",
    type: 'fixed',
    name: "Dia dos Pais",
    category: "Holidays",
    description: "Contagem regressiva para o Dia dos Pais. A data varia por pa\u00eds.",
    pageUrl: "https://countdowns.site/pt/countdown/fathers-day/"
  };
  function nextDate(dates) {
    var now = new Date();
    for (var i = 0; i < dates.length; i++) {
      if (new Date(dates[i]) > now) return new Date(dates[i]);
    }
    return new Date(dates[dates.length - 1]);
  }
  var _savedC = (typeof localStorage !== 'undefined' ? localStorage.getItem('cd_country') : null) || '';
  var activeIdx = DEFAULT_IDX;
  if (_savedC) {
    for (var _i = 0; _i < VARIANTS.length; _i++) {
      if (VARIANTS[_i].countries && VARIANTS[_i].countries.indexOf(_savedC) >= 0) {
        activeIdx = _i; break;
      }
    }
  }
  CountdownEngine.renderEmbed('root', Object.assign({}, _cfg, { date: nextDate(VARIANTS[activeIdx].dates) }));
})();
</script>
</body>
</html>
