<meta name="description" content="Real-time countdowns to sports, game releases, holidays, sales, and every event the world is waiting for. Free, live, no ads.">

<script>if(localStorage.getItem('cd_theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
<style>
/* ── Category badge on cards ───────────────────────── */
.cd-card-cat{font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.55;margin-top:.3rem;display:block}
/* ── Footer visibility fix ─────────────────────────── */
.site-footer{color:rgba(255,255,255,.5)}
[data-theme="light"] .site-footer{color:rgba(0,0,0,.35)}
/* ── Country selector ───────────────────────────────── */
.country-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem}
.country-overlay.hidden{display:none}
.country-modal{background:var(--card-bg,#0E0E1C);border:1px solid rgba(129,140,248,.3);border-radius:20px;padding:2rem 1.75rem;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 0 80px rgba(129,140,248,.18)}
.country-modal h2{font-size:1.35rem;font-weight:700;margin:0 0 .4rem;color:var(--text,#F1F5F9)}
.country-modal p{font-size:.875rem;color:var(--muted,#94A3B8);margin:0 0 1.4rem;line-height:1.5}
.country-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem;margin-bottom:1rem}
@media(min-width:400px){.country-grid{grid-template-columns:repeat(4,1fr)}}
.country-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.6rem .3rem;cursor:pointer;text-align:center;transition:all .15s;color:var(--text,#F1F5F9);font-size:.78rem;font-weight:500;font-family:inherit}
.country-item .ci-flag{font-size:1.6rem;display:block;margin-bottom:.2rem}
.country-item:hover{background:rgba(129,140,248,.15);border-color:rgba(129,140,248,.35)}
.country-item.selected{background:rgba(129,140,248,.22);border-color:#818CF8;box-shadow:0 0 14px rgba(129,140,248,.28)}
.country-skip{width:100%;background:transparent;border:none;color:var(--muted,#64748B);font-size:.82rem;cursor:pointer;padding:.6rem;margin-top:.25rem;text-decoration:underline;font-family:inherit}
.country-skip:hover{color:var(--text,#F1F5F9)}
.country-detected{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--muted,#64748B);margin-bottom:1rem}
.country-detected-dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;flex-shrink:0}
/* Header country flag button */
.country-flag-btn{font-size:1.25rem;background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:.2rem .4rem;line-height:1;transition:all .15s;margin-left:.25rem}
.country-flag-btn:hover{border-color:rgba(129,140,248,.5);transform:scale(1.08)}
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://countdowns.site/#website",
  "url": "https://countdowns.site/",
  "name": "Countdowns.site",
  "description": "Real-time countdowns to every event that matters",
  "inLanguage": "en",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://countdowns.site/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
</head>
<body>

<!-- ── HEADER ── -->
<header class="site-header">
  <a href="/" class="logo">countdowns<span class="logo-tld">.site</span></a>
  <div class="header-right">
    <button class="theme-btn" id="theme-toggle">Light</button>
    <div class="lang-seg" role="group" aria-label="Language">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="pt">PT</button>
      <button class="lang-btn" data-lang="fr">FR</button>
    </div>
    <button class="country-flag-btn" id="country-flag-btn" title="Select your country" aria-label="Select country">🌍</button>
  </div>
</header>

<!-- ── HERO ── -->
<div class="hub-hero">
  <div class="hub-hero-label"><span></span><span id="hero-live">Live · updated in real time</span></div>
  <h1 id="hero-h1">Every countdown<br>that <em>matters</em></h1>
  <p class="hub-hero-sub" id="hero-sub">Sports, releases, holidays, sales — every event the world is waiting for.</p>
  <div class="sort-toggle" role="group" aria-label="Sort order">
    <button class="sort-btn active" data-sort="chrono" id="sort-chrono">Soonest first</button>
    <button class="sort-btn" data-sort="category" id="sort-cat">By category</button>
  </div>
</div>

<!-- ── HUB BODY ── -->
<main class="hub-body" id="hub-body">
  <!-- JS renders cards here -->
  <div id="hub-content"></div>
</main>

<footer class="site-footer">
  countdowns<span class="logo-tld">.site</span>
</footer>

<!-- ── COUNTRY MODAL ── -->
<div id="country-overlay" class="country-overlay hidden" role="dialog" aria-modal="true" aria-label="Select your country">
  <div class="country-modal">
    <h2>Where are you from?</h2>
    <p>We'll show you the most relevant countdowns for your country and language.</p>
    <div id="country-detected" class="country-detected hidden"></div>
    <div id="country-grid" class="country-grid"></div>
    <button id="country-skip" class="country-skip">Skip — show everything</button>
  </div>
</div>

    { slug:'cannes',     name:'Cannes Film Festival',type:'variable', countries:['global'], regions:['global'],     cat:'Entertainment', url:'/countdown/cannes/'    },
    /* ── Entertainment – Europe ── */
    { slug:'eurovision', name:'Eurovision',         type:'variable', countries:['FR','BE','CH','ES','PT','GB','IE','AU','DE','AT','SE','NO','FI','NL','IT','GR'], regions:['global','fr'], cat:'Entertainment', url:'/countdown/eurovision/' },
    /* ── Entertainment – North America ── */
    { slug:'coachella',  name:'Coachella',          type:'variable', countries:['US','MX','CA','GB'],              regions:['en'],      cat:'Entertainment', url:'/countdown/coachella/' },

    /* ── Sales – Global ── */
    { slug:'black-friday', name:'Black Friday', type:'auto',     countries:['global'], regions:['global'], cat:'Sales', url:'/countdown/black-friday/' },
    { slug:'cyber-monday', name:'Cyber Monday', type:'auto',     countries:['global'], regions:['global'], cat:'Sales', url:'/countdown/cyber-monday/' },
    /* ── Sales – LatAm ── */
    { slug:'hot-sale',     name:'Hot Sale',     type:'variable', countries:['AR','MX'],                    regions:['es'], cat:'Sales', url:'/countdown/hot-sale/' },

    /* ── Nature – Global ── */
    { slug:'full-moon', name:'Next Full Moon', type:'auto',     countries:['global'], regions:['global'], cat:'Nature', url:'/countdown/full-moon/' },
    { slug:'eclipse',   name:'Solar Eclipse',  type:'variable', countries:['global'], regions:['global'], cat:'Nature', url:'/countdown/eclipse/'   },

    /* ── Music – Argentina ── */
    { slug:'lollapalooza-ar', name:'Lollapalooza Argentina', type:'variable', countries:['AR','UY'],  regions:['es'], cat:'Music', url:'/countdown/lollapalooza-ar/' },
    { slug:'cosquin-rock',    name:'Cosquín Rock',           type:'variable', countries:['AR'],        regions:['es'], cat:'Music', url:'/countdown/cosquin-rock/'    },
    /* ── Music – Chile ── */
    { slug:'lollapalooza-cl', name:'Lollapalooza Chile',     type:'variable', countries:['CL','AR'],  regions:['es'], cat:'Music', url:'/countdown/lollapalooza-cl/' },
    /* ── Music – Brazil / Portugal ── */
    { slug:'rock-in-rio',     name:'Rock in Rio',            type:'variable', countries:['BR','PT'],   regions:['pt'], cat:'Music', url:'/countdown/rock-in-rio/'     },

    /* ── Fashion – Global ── */
    { slug:'nyfw',     name:'New York Fashion Week',     type:'variable', countries:['global'], regions:['global'], cat:'Fashion', url:'/countdown/nyfw/'     },
    { slug:'paris-fw', name:'Paris Fashion Week',        type:'variable', countries:['global'], regions:['global'], cat:'Fashion', url:'/countdown/paris-fw/' },
    { slug:'milan-fw', name:'Milan Fashion Week',        type:'variable', countries:['global'], regions:['global'], cat:'Fashion', url:'/countdown/milan-fw/' },
    /* ── Fashion – Argentina ── */
    { slug:'bafweek',  name:'Buenos Aires Fashion Week', type:'variable', countries:['AR'],     regions:['es'],     cat:'Fashion', url:'/countdown/bafweek/'  },

    /* ── Politics – Argentina ── */
    { slug:'elecciones-ar', name:'Argentine Elections', type:'auto', countries:['AR'], regions:['es'], cat:'Politics', url:'/countdown/elecciones-ar/' },
  ];

  /* ── State ── */
  var currentLang = 'en';
  var currentSort = 'chrono';

  /* ── Apply language (updates buttons, hero text + state) ── */
  function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    updateHeroUI();
  }

  /* ── Filter by COUNTRY (not language) ── */
  function filteredEvents() {
    var country = localStorage.getItem('cd_country') || 'global';
    if (country === 'global') return EVENTS;   /* no country set → show all */
    return EVENTS.filter(function (e) {
      return e.countries.indexOf('global') >= 0 || e.countries.indexOf(country) >= 0;
    });
  }

  /* ── Resolve card URL to the correct language page ── */
  function cardURL(ev) {
    if (currentLang === 'en') return ev.url;
    var hasPage = ev.regions.indexOf('global') >= 0 || ev.regions.indexOf(currentLang) >= 0;
    return hasPage ? '/' + currentLang + '/countdown/' + ev.slug + '/' : ev.url;
  }

  /* ── Time buckets ── */
  var BUCKET_KEYS = ['today','week','month','soon','year','future'];
  var BUCKET_TESTS = [
    function (d) { return d <= 0; },
    function (d) { return d <= 7; },
    function (d) { return d <= 30; },
    function (d) { return d <= 90; },
    function (d) { return d <= 365; },
    function ()  { return true; },
  ];
  function bucket(days) {
    for (var i = 0; i < BUCKET_TESTS.length; i++) {
      if (BUCKET_TESTS[i](days)) return BUCKET_KEYS[i];
    }
    return 'future';
  }

  /* ── Render a single card ── */
  function cardHTML(ev, data, showCat) {
    var c = cc(ev.cat);
    var style = 'style="--cat-color:' + c.color + ';--cat-glow:' + c.glow + '"';
    var name = evName(ev);
    var badge = showCat ? '<span class="cd-card-cat">' + catName(ev.cat) + '</span>' : '';
    var inner = '';
    if (data.state === 'unknown') {
      inner = '<div class="cd-card-name">' + name + '</div>' +
              '<div class="cd-card-unknown">' + ui('tba') + '</div>' + badge;
    } else if (data.state === 'today') {
      inner = '<div class="cd-card-name">' + name + '</div>' +
              '<div class="cd-card-today">' + ui('today') + '</div>' + badge;
    } else {
      inner = '<div class="cd-card-name">' + name + '</div>' +
              '<div class="cd-card-num">' + data.days + '</div>' +
              '<div class="cd-card-lbl">' + ui('days') + '</div>' + badge;
    }
    return '<a href="' + cardURL(ev) + '" class="cd-card" ' + style + '>' + inner + '</a>';
  }

  /* ── Render hub (called once all card data loaded) ── */
  function renderHub(results) {
    var container = document.getElementById('hub-content');
    if (!container) return;
    var html = '';

    if (currentSort === 'chrono') {
      results.sort(function (a, b) {
        function rank(r) {
          if (r.data.state === 'today')   return -1;
          if (r.data.state === 'future')  return r.data.days;
          if (r.data.state === 'unknown') return 99999;
          return 99998;
        }
        return rank(a) - rank(b);
      });

      var lastBucket = null;
      results.forEach(function (r) {
        if (r.data.state === 'future' || r.data.state === 'today') {
          var b = bucket(r.data.state === 'today' ? 0 : r.data.days);
          if (b !== lastBucket) {
            if (lastBucket !== null) html += '</div>';
            html += '<div class="time-bucket-hdr">' + ui(b) + '</div>';
            html += '<div class="cards-grid">';
            lastBucket = b;
          }
          html += cardHTML(r.ev, r.data, true);   /* show category badge */
        }
      });
      if (lastBucket !== null) html += '</div>';

      var tba = results.filter(function (r) { return r.data.state === 'unknown'; });
      if (tba.length) {
        html += '<div class="time-bucket-hdr">' + ui('tba') + '</div>';
        html += '<div class="cards-grid">';
        tba.forEach(function (r) { html += cardHTML(r.ev, r.data, true); });
        html += '</div>';
      }
    } else {
      var grouped = {};
      var catOrder = [];
      results.forEach(function (r) {
        var cat = r.ev.cat;
        if (!grouped[cat]) { grouped[cat] = []; catOrder.push(cat); }
        grouped[cat].push(r);
      });
      catOrder.forEach(function (cat) {
        var c = cc(cat);
        html += '<div class="hub-section">';
        html += '<div class="section-hdr" style="--cat-color:' + c.color + ';--cat-glow:' + c.glow + '">';
        html += '<span class="section-hdr-label">' + catName(cat) + '</span></div>';   /* translated */
        html += '<div class="cards-grid">';
        grouped[cat].forEach(function (r) { html += cardHTML(r.ev, r.data, false); });
        html += '</div></div>';
      });
    }

    container.innerHTML = html;
  }

  /* ── Load all card data then render ── */
  function loadHub() {
    var container = document.getElementById('hub-content');
    var evs = filteredEvents();

    /* Skeleton placeholders */
    var skeletons = '';
    for (var s = 0; s < Math.min(evs.length, 12); s++) {
      skeletons += '<div class="cd-card-skeleton"></div>';
    }
    container.innerHTML = '<div class="cards-grid">' + skeletons + '</div>';

    var results = new Array(evs.length);
    var loaded  = 0;

    evs.forEach(function (ev, i) {
      CountdownEngine.getCardData({ slug: ev.slug, type: ev.type }, function (data) {
        results[i] = { ev: ev, data: data };
        loaded++;
        if (loaded === evs.length) renderHub(results);
      });
    });
  }

  /* ── Language switcher — in-place, no redirect ── */
  document.querySelectorAll('.lang-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var lang = btn.dataset.lang;
      if (lang === currentLang) return;
      localStorage.setItem('cd_lang', lang);   /* explicit language choice */
      setLang(lang);
      loadHub();
    });
  });

  /* ── Sort toggle ── */
  document.querySelectorAll('.sort-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.sort-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      renderHub(window._hubResults || []);
    });
  });

  /* ── Cache results for re-sort without re-fetch ── */
  var _origRender = renderHub;
  renderHub = function (results) { window._hubResults = results; _origRender(results); };

  /* ── Theme toggle ── */
  (function () {
    var btn = document.getElementById('theme-toggle');
    var saved = localStorage.getItem('cd_theme');
    if (saved === 'light') { document.documentElement.setAttribute('data-theme', 'light'); btn.textContent = 'Dark'; }
    btn.addEventListener('click', function () {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('cd_theme','dark'); btn.textContent = 'Light'; }
      else          { document.documentElement.setAttribute('data-theme','light');  localStorage.setItem('cd_theme','light'); btn.textContent = 'Dark'; }
    });
  })();

  /* ── Country selector ── */
  (function () {

    function applyCountry(code) {
      localStorage.setItem('cd_country', code);
      /* Changing country always resets language to that country's default.
         Any previous manual language choice is cleared. */
      localStorage.removeItem('cd_lang');
      setLang(countryToLang(code));
      /* Update flag button */
      var fb = document.getElementById('country-flag-btn');
      if (fb) fb.textContent = FLAG_MAP[code] || '🌍';
    }

    function openModal(preselectedCode) {
      var overlay = document.getElementById('country-overlay');
      var grid    = document.getElementById('country-grid');
      var det     = document.getElementById('country-detected');
      if (!grid) return;

      if (preselectedCode && preselectedCode !== 'global') {
        var f = FLAG_MAP[preselectedCode] || '📍';
        det.innerHTML = '<span class="country-detected-dot"></span>Auto-detected: ' + f + ' ' + preselectedCode;
        det.classList.remove('hidden');
      } else {
        det.classList.add('hidden');
      }

      grid.innerHTML = COUNTRY_LIST.map(function (c) {
        var sel = c.code === preselectedCode ? ' selected' : '';
        return '<button class="country-item' + sel + '" data-code="' + c.code + '">' +
               '<span class="ci-flag">' + c.flag + '</span>' + c.name + '</button>';
      }).join('');

      overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      grid.querySelectorAll('.country-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          grid.querySelectorAll('.country-item').forEach(function (b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          applyCountry(btn.dataset.code);
          overlay.classList.add('hidden');
          document.body.style.overflow = '';
          loadHub();
        });
      });

      document.getElementById('country-skip').onclick = function () {
        overlay.classList.add('hidden');
        document.body.style.overflow = '';
        localStorage.setItem('cd_country', 'global');
        var fb = document.getElementById('country-flag-btn');
        if (fb) fb.textContent = '🌍';
      };

      overlay.onclick = function (e) {
        if (e.target === overlay) {
          overlay.classList.add('hidden');
          document.body.style.overflow = '';
          if (!localStorage.getItem('cd_country')) localStorage.setItem('cd_country', 'global');
        }
      };
    }

    /* Header flag button opens modal */
    var flagBtn = document.getElementById('country-flag-btn');
    if (flagBtn) {
      flagBtn.addEventListener('click', function () {
        openModal(localStorage.getItem('cd_country') || 'global');
      });
    }

    /* ── Boot: language priority: cd_lang > cd_country-derived > 'en' ── */
    var savedLang    = localStorage.getItem('cd_lang');
    var savedCountry = localStorage.getItem('cd_country');

    if (savedLang) {
      setLang(savedLang);
    } else if (savedCountry) {
      setLang(countryToLang(savedCountry));
    }

    if (savedCountry) {
      var fb = document.getElementById('country-flag-btn');
      if (fb) fb.textContent = FLAG_MAP[savedCountry] || '🌍';
    }

    loadHub();

    /* First visit: detect country after hub starts loading */
    if (!savedCountry) {
      fetch('https://ipapi.co/json/?fields=country_code')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var code = ((data && data.country_code) || 'global').toUpperCase();
          openModal(code);
        })
        .catch(function () { openModal('global'); });
    }

  })();

})();
</script>
