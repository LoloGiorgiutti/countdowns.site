<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- bg -->
  <rect width="32" height="32" rx="7" fill="#0A0A14"/>
  <!-- calendar body -->
  <rect x="4" y="8" width="24" height="21" rx="3" fill="#13132a"/>
  <!-- header -->
  <rect x="4" y="8" width="24" height="9" rx="3" fill="url(#hdr)"/>
  <rect x="4" y="14" width="24" height="3" fill="url(#hdr)"/>
  <!-- rings -->
  <rect x="9" y="5" width="3" height="6" rx="1.5" fill="#818CF8"/>
  <rect x="20" y="5" width="3" height="6" rx="1.5" fill="#818CF8"/>
  <!-- header text: tiny "cd" -->
  <text x="16" y="14.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="5.5" font-weight="700" fill="#ffffff" opacity="0.9">CDN</text>
  <!-- big number -->
  <text x="16" y="26" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="11" font-weight="900" fill="#ffffff">3</text>
  <!-- dot grid hint -->
  <circle cx="8" cy="22" r="1" fill="#818CF8" opacity="0.3"/>
  <circle cx="24" cy="22" r="1" fill="#818CF8" opacity="0.3"/>
</svg>
