<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0A0A14"/>
  <!-- calendar body -->
  <rect x="4" y="9" width="24" height="20" rx="3" fill="#1a1a2e" stroke="#818CF8" stroke-width="1.5"/>
  <!-- header band -->
  <rect x="4" y="9" width="24" height="8" rx="3" fill="#818CF8"/>
  <rect x="4" y="14" width="24" height="3" fill="#818CF8"/>
  <!-- spiral rings -->
  <circle cx="10" cy="9" r="2" fill="#0A0A14" stroke="#818CF8" stroke-width="1"/>
  <circle cx="16" cy="9" r="2" fill="#0A0A14" stroke="#818CF8" stroke-width="1"/>
  <circle cx="22" cy="9" r="2" fill="#0A0A14" stroke="#818CF8" stroke-width="1"/>
  <!-- number -->
  <text x="16" y="24" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="10" font-weight="900" fill="#ffffff">3</text>
</svg>
