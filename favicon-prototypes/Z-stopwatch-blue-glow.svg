<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- main blue gradient top-to-bottom -->
    <linearGradient id="blue" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#52D9FF"/>
      <stop offset="50%"  stop-color="#2A7FE8"/>
      <stop offset="100%" stop-color="#1855D4"/>
    </linearGradient>
    <!-- wedge fill -->
    <linearGradient id="wedge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#7AE8FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2A7FE8" stop-opacity="0.8"/>
    </linearGradient>
    <!-- glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- crown button top center -->
  <rect x="40" y="4" width="20" height="9" rx="4.5" fill="url(#blue)" filter="url(#glow)"/>
  <rect x="46" y="12" width="8" height="7" rx="2" fill="url(#blue)"/>

  <!-- left side button -->
  <rect x="8" y="36" width="12" height="16" rx="5" fill="url(#blue)" filter="url(#glow)"/>
  <!-- right side button -->
  <rect x="80" y="36" width="12" height="16" rx="5" fill="url(#blue)" filter="url(#glow)"/>

  <!-- outer ring -->
  <circle cx="50" cy="58" r="34" fill="none" stroke="url(#blue)" stroke-width="5.5" filter="url(#glow)"/>

  <!-- inner face (transparent/dark) -->
  <circle cx="50" cy="58" r="27" fill="#000000" fill-opacity="0.45"/>

  <!-- wedge sector ~90° (top-right quadrant, 12 o'clock to 3 o'clock) -->
  <path d="M50 58 L50 31.5 A26.5 26.5 0 0 1 76.5 58 Z"
        fill="url(#wedge)" opacity="0.85"/>

  <!-- tick marks -->
  <!-- 12 -->
  <line x1="50" y1="32" x2="50" y2="37" stroke="url(#blue)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 3 -->
  <line x1="77" y1="58" x2="72" y2="58" stroke="url(#blue)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 6 -->
  <line x1="50" y1="84" x2="50" y2="79" stroke="url(#blue)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 9 -->
  <line x1="23" y1="58" x2="28" y2="58" stroke="url(#blue)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- minute hand (pointing ~12) -->
  <line x1="50" y1="58" x2="50" y2="36" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <!-- hour hand (pointing ~4-5) -->
  <line x1="50" y1="58" x2="66" y2="70" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- center dot -->
  <circle cx="50" cy="58" r="4" fill="url(#blue)" filter="url(#glow)"/>
</svg>
