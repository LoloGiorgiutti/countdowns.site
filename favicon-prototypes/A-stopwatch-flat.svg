<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark bg -->
  <rect width="32" height="32" rx="7" fill="#0A0A14"/>
  <!-- crown button top center -->
  <rect x="13.5" y="2" width="5" height="3" rx="1.5" fill="#818CF8"/>
  <rect x="15" y="4.5" width="2" height="2.5" fill="#818CF8"/>
  <!-- left side button -->
  <rect x="3.5" y="12" width="3" height="5" rx="1.5" fill="#818CF8"/>
  <!-- right side button -->
  <rect x="25.5" y="12" width="3" height="5" rx="1.5" fill="#818CF8"/>
  <!-- watch body outer ring -->
  <circle cx="16" cy="18" r="10" fill="none" stroke="#818CF8" stroke-width="2.5"/>
  <!-- watch face -->
  <circle cx="16" cy="18" r="7" fill="#0A0A14"/>
  <!-- wedge / elapsed time slice -->
  <path d="M16 18 L16 11.5 A6.5 6.5 0 0 1 22.5 18 Z" fill="#818CF8" opacity="0.9"/>
  <!-- center dot -->
  <circle cx="16" cy="18" r="1.2" fill="#ffffff"/>
  <!-- tick marks -->
  <line x1="16" y1="12" x2="16" y2="13.2" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="16" y1="22.8" x2="16" y2="24" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="10.5" y1="18" x2="11.7" y2="18" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="20.3" y1="18" x2="21.5" y2="18" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
