<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- bg -->
  <rect width="32" height="32" rx="7" fill="#0A0A14"/>
  <!-- calendar shape -->
  <rect x="3" y="7" width="26" height="22" rx="3" fill="#f1f5f9"/>
  <!-- red top band -->
  <rect x="3" y="7" width="26" height="9" rx="3" fill="#818CF8"/>
  <rect x="3" y="12" width="26" height="4" fill="#818CF8"/>
  <!-- rings -->
  <rect x="9" y="4.5" width="3" height="6" rx="1.5" fill="#ffffff" opacity="0.7"/>
  <rect x="20" y="4.5" width="3" height="6" rx="1.5" fill="#ffffff" opacity="0.7"/>
  <!-- "cd" label on band -->
  <text x="16" y="13.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" font-weight="700" fill="#ffffff" letter-spacing="1">cd</text>
  <!-- big countdown number -->
  <text x="16" y="26.5" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" font-weight="900" fill="#1e1b4b">3</text>
</svg>
