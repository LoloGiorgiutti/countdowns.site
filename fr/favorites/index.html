<style>
/* ── HUB HERO layout ── */
.hub-hero { max-width:1120px; margin:0 auto; padding:56px 32px 0; }
.hub-hero-top { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:32px; }
.hub-hero h1 { font-size:clamp(2rem,4vw,3rem); font-weight:700; letter-spacing:-.035em; line-height:1.1; }
.hub-hero h1 em { font-style:normal; color:var(--txt-muted,#75758f); }
.hub-hero-label { display:inline-flex; align-items:center; gap:7px; font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--txt-muted,#75758f); margin-bottom:14px; }
/* ── COMPACT GRID ── */
.hub-compact-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:32px; }
/* ── COMPACT CARD ── */
.hub-cc { position:relative; overflow:hidden; border-radius:14px; padding:18px 16px 14px; min-height:118px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--card-border,rgba(255,255,255,.065)); background:var(--card-bg,#111119); text-decoration:none; color:inherit; transition:transform .14s, border-color .14s; }
.hub-cc::before { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at -10% 60%, var(--cat-glow,rgba(129,140,248,.07)) 0%, transparent 60%); opacity:.5; }
.hub-cc:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.12); }
[data-theme="light"] .hub-cc { background:#fff; border-color:rgba(0,0,0,.07); }
[data-theme="light"] .hub-cc:hover { border-color:rgba(0,0,0,.12); }
.hub-cc-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
.hub-cc-cat { font-size:.67rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--cat-color,#818CF8); opacity:.9; }
.hub-cc-pill { flex-shrink:0; font-size:1.25rem; font-weight:700; letter-spacing:-.03em; line-height:1; color:#ffffff; text-shadow:0 0 10px rgba(255,255,255,.2); white-space:nowrap; }
[data-theme="light"] .hub-cc-pill { color:#0d0d18; text-shadow:0 0 10px rgba(0,0,0,.1); }
.hub-cc-pill--today { font-size:.8rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--cat-color,#818CF8); text-shadow:0 0 12px var(--cat-glow,rgba(129,140,248,.5)); }
.hub-cc-pill--tba { font-size:.75rem; font-weight:600; color:var(--txt-muted,#75758f); text-shadow:none; }
.hub-cc-name { font-size:1.08rem; font-weight:700; letter-spacing:-.02em; line-height:1.25; color:var(--txt,#eeeef8); flex:1; }
[data-theme="light"] .hub-cc-name { color:#0d0d18; }
.hub-cc-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
.hub-cc-date { font-size:.73rem; color:var(--txt-dim,#3d3d52); }
[data-theme="light"] .hub-cc-date { color:#b0b0c8; }
.hub-cc-arrow { font-size:.85rem; color:var(--txt-dim,#3d3d52); transition:transform .14s, color .14s; }
.hub-cc:hover .hub-cc-arrow { transform:translateX(3px); color:var(--cat-color,#818CF8); }
.hub-cc--past { opacity:.45; }
/* ── BUCKET HEADER ── */
.hub-bucket-hdr { font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--txt-dim,#3d3d52); display:flex; align-items:center; gap:10px; margin-bottom:12px; margin-top:36px; }
.hub-bucket-hdr:first-child { margin-top:0; }
.hub-bucket-hdr::after { content:''; flex:1; height:1px; background:var(--card-border,rgba(255,255,255,.065)); }
/* ── SKELETON ── */
.hub-cc--skeleton { background:var(--card-bg,#111119); animation:skel-pulse 1.5s infinite; min-height:118px; }
@keyframes skel-pulse { 0%,100%{opacity:.4} 50%{opacity:.7} }
/* ── HUB BODY ── */
.hub-body { max-width:1120px; margin:0 auto; padding:0 32px 80px; }
/* ── EMPTY STATE ── */
.hub-empty { text-align:center; padding:80px 0 60px; }
.hub-empty-icon { font-size:3rem; margin-bottom:16px; opacity:.4; }
.hub-empty-title { font-size:1.2rem; font-weight:700; color:var(--txt,#eeeef8); margin-bottom:8px; }
[data-theme="light"] .hub-empty-title { color:#0d0d18; }
.hub-empty-sub { font-size:.9rem; color:var(--txt-muted,#75758f); margin-bottom:28px; }
.hub-empty-btn { display:inline-flex; align-items:center; gap:6px; background:var(--txt,#eeeef8); color:var(--bg,#08080f); border:none; border-radius:99px; padding:10px 22px; font-size:.85rem; font-weight:700; text-decoration:none; cursor:pointer; font-family:inherit; }
[data-theme="light"] .hub-empty-btn { background:#0d0d18; color:#f1f1f7; }
/* ── BACK LINK ── */
.hub-back-link { display:inline-flex; align-items:center; gap:5px; font-size:.8rem; font-weight:600; color:var(--txt-muted,#75758f); text-decoration:none; margin-bottom:6px; transition:color .15s; }
.hub-back-link:hover { color:var(--txt,#eeeef8); }
[data-theme="light"] .hub-back-link:hover { color:#0d0d18; }
/* ── CLEAR ALL BUTTON ── */
.hub-clear-btn { font-size:.75rem; font-weight:600; color:var(--txt-muted,#75758f); background:none; border:1px solid var(--card-border,rgba(255,255,255,.065)); border-radius:99px; padding:5px 12px; cursor:pointer; font-family:inherit; transition:color .15s, border-color .15s; display:none; }
.hub-clear-btn:hover { color:#F87171; border-color:#F87171; }
[data-theme="light"] .hub-clear-btn { border-color:rgba(0,0,0,.1); }
/* ── FAVORITES BUTTON ── */
.hub-fav-btn { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:1.1rem; line-height:1; color:var(--txt-dim,#3d3d52); padding:4px 5px; opacity:1; transition:color .15s, transform .12s; z-index:2; color:#FBBF24; }
.hub-fav-btn:hover { transform:scale(1.18); }
/* Fix: compact card fav button at bottom-right */
.hub-cc .hub-fav-btn { top:auto !important; bottom:12px; right:14px; opacity:1; }
.hub-cc .hub-cc-arrow { transition:transform .14s, color .14s, opacity .14s; }
.hub-cc:hover .hub-cc-arrow { opacity:0; }
.hub-cc:has(.hub-fav-btn.active) .hub-cc-arrow { opacity:0; }
/* ── FAVORITES HEADER LINK ── */
.hub-fav-header-link { display:inline-flex; align-items:center; gap:5px; font-size:.78rem; font-weight:600; color:var(--txt,#eeeef8); text-decoration:none; padding:6px 11px; border-radius:99px; border:1px solid rgba(255,255,255,.14); transition:color .15s, border-color .15s; white-space:nowrap; }
[data-theme="light"] .hub-fav-header-link { border-color:rgba(0,0,0,.16); color:#0d0d18; }
.hub-fav-badge { display:inline-flex; align-items:center; justify-content:center; min-width:15px; height:15px; background:#FBBF24; color:#000; font-size:.6rem; font-weight:700; border-radius:99px; padding:0 4px; line-height:1; }
/* ── RESPONSIVE ── */
@media(max-width:640px) {
  .hub-hero { padding:36px 16px 0; }
  .hub-hero-top { flex-direction:column; align-items:flex-start; gap:16px; }
  .hub-hero h1 { font-size:1.9rem; }
  .hub-body { padding:0 16px 60px; }
  .hub-compact-grid { grid-template-columns:1fr 1fr; gap:8px; }
}
/* ── Override countdown.css conflicts ── */
.hub-hero { text-align:left !important; }
.hub-hero::before { display:none !important; }

  var EVENTS_BY_SLUG = {};
  EVENTS.forEach(function(e){ EVENTS_BY_SLUG[e.slug] = e; });

  function buildCompact(ev, data) {
    var c = cc(ev.cat);
    var style = 'style="--cat-color:' + c.color + ';--cat-glow:' + c.glow + '"';
    var pill = data.state === 'today'   ? '<span class="hub-cc-pill hub-cc-pill--today">Aujourd&#39;hui</span>'
             : data.state === 'unknown' ? '<span class="hub-cc-pill hub-cc-pill--tba">TBA</span>'
             : data.state === 'past'    ? ''
             : '<span class="hub-cc-pill">' + data.days + '</span>';
    var dateStr = data.date ? CountdownEngine.fmtDate(data.date, 'fr')
                : data.state === 'unknown' ? 'Date TBA' : '';
    var cls = 'hub-cc' + (data.state === 'past' ? ' hub-cc--past' : '');
    return '<a href="' + (LANG_URLS[ev.slug] || ev.url) + '" class="' + cls + '" ' + style + '>' +
      '<button class="hub-fav-btn active" data-slug="' + ev.slug + '" title="Retirer des favoris">★</button>' +
      '<div><div class="hub-cc-top"><span class="hub-cc-cat">' + (CAT_LABEL[ev.cat]||ev.cat) + '</span>' + pill + '</div>' +
      '<div class="hub-cc-name">' + (NAMES[ev.slug] || ev.name) + '</div></div>' +
      '<div class="hub-cc-bottom"><span class="hub-cc-date">' + dateStr + '</span><span class="hub-cc-arrow">→</span></div>' +
    '</a>';
  }

  function renderFavorites() {
    var container = document.getElementById('hub-content');
    var favs = getFavs();
    var customFavs = getCustomFavs();
    var clearBtn = document.getElementById('hub-clear-btn');
    updateFavBadge();

    var slugsToLoad = favs.filter(function(s){ return EVENTS_BY_SLUG[s]; });

    if (slugsToLoad.length === 0 && customFavs.length === 0) {
      if (clearBtn) clearBtn.style.display = 'none';
      container.innerHTML = '<div class="hub-empty">' +
        '<div class="hub-empty-icon">☆</div>' +
        '<div class="hub-empty-title">Aucun favori pour l&#39;instant</div>' +
        '<div class="hub-empty-sub">Cliquez sur ☆ sur n&#39;importe quel compte à rebours pour le sauvegarder ici.</div>' +
        '<a href="/" class="hub-empty-btn">Voir tous les comptes à rebours</a>' +
      '</div>';
      return;
    }

    if (clearBtn) clearBtn.style.display = 'inline-flex';


      container.innerHTML = '<div class="hub-empty"><div class="hub-empty-icon">☆</div><div class="hub-empty-title">Aucun favori trouvé</div><div class="hub-empty-sub">Les comptes à rebours sauvegardés sont introuvables.</div><a href="/" class="hub-empty-btn">Voir tous les comptes à rebours</a></div>';
      return;
    }

    // Show skeleton while loading
    var skel = '';
    for (var s = 0; s < slugsToLoad.length; s++) skel += '<div class="hub-cc hub-cc--skeleton"></div>';
    container.innerHTML = customSection + '<div class="hub-bucket-hdr">Vos favoris · ' + slugsToLoad.length + ' sauvegardés</div><div class="hub-compact-grid">' + skel + '</div>';

    var results = new Array(slugsToLoad.length);
    var loaded = 0;
    slugsToLoad.forEach(function(slug, i) {
      var ev = EVENTS_BY_SLUG[slug];
      CountdownEngine.getCardData({ slug: ev.slug, type: 'variable' }, function(data) {
        results[i] = { ev: ev, data: data };
        loaded++;
        if (loaded === slugsToLoad.length) {
          results.sort(function(a,b){
            function rank(r){ return r.data.state==='today'?-1:r.data.state==='future'?r.data.days:r.data.state==='unknown'?99999:99998; }
            return rank(a)-rank(b);
          });
          var html = customSection + '<div class="hub-bucket-hdr">Vos favoris · ' + results.length + ' sauvegardés</div><div class="hub-compact-grid">';
          results.forEach(function(r){ html += buildCompact(r.ev, r.data); });
          html += '</div>';
          container.innerHTML = html;
          updateFavBadge();
        }
      });
    });
  }

  // Fav button click — remove from favorites and re-render
  document.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('.hub-fav-btn') : null;
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    var slug = btn.dataset.slug;
    toggleFav(slug); // always removes on this page (all are already favorited)
    renderFavorites();
  });

  // Clear all
  var clearBtn = document.getElementById('hub-clear-btn');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      if (confirm('Supprimer tous les favoris ?')) {
        setFavs([]);
        setCustomFavs([]);
        renderFavorites();
      }
    });
  }

  renderFavorites();

  // Theme toggle
  (function () {
    var btn = document.getElementById('theme-toggle');
    var saved = localStorage.getItem('cd_theme');
    var SUN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
    var MOON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    if (saved === 'light') { document.documentElement.setAttribute('data-theme', 'light'); btn.innerHTML = MOON; }
    btn.addEventListener('click', function () {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('cd_theme', 'dark');
        btn.innerHTML = SUN;
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('cd_theme', 'light');
        btn.innerHTML = MOON;
      }
    });
  })();

  // Country flag button (restore saved flag)
  (function(){
    var fb = document.getElementById('country-flag-btn');
    var savedC = typeof localStorage !== 'undefined' ? localStorage.getItem('cd_country') : null;
    if (savedC && fb && CountdownEngine.FLAG_MAP) fb.textContent = CountdownEngine.FLAG_MAP[savedC] || '🌍';
    if (fb) {
      fb.addEventListener('click', function(){
        CountdownEngine.openCountryPicker(function(code){
          localStorage.setItem('cd_country', code);
          if (fb && CountdownEngine.FLAG_MAP) fb.textContent = CountdownEngine.FLAG_MAP[code] || '🌍';
        });
      });
    }
  })();

})();
