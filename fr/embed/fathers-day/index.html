<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fête des Pères — countdowns.site</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
:root{--cat:#4ADE80;--cat-glow:rgba(74,222,128,.2);--cat-soft:rgba(74,222,128,.08);}
</style>
</head>
<body>
<div id="root"></div>
<script src="/countdown-engine.js"></script>
<script>
(function() {
  var VARIANTS = [{"code": "us", "label": "US, Canada, UK & Mexico", "dates": ["2026-06-21", "2027-06-20"]}, {"code": "au", "label": "Australia & New Zealand", "dates": ["2026-09-06", "2027-09-05"]}, {"code": "de", "label": "Germany & Austria", "dates": ["2026-05-14", "2027-05-06"]}, {"code": "br", "label": "Brasil / Brazil", "dates": ["2026-08-09", "2027-08-08"]}, {"code": "fr", "label": "France", "dates": ["2026-06-21", "2027-06-20"]}];
  var DEFAULT_IDX = 4;
  var _cfg = {
    slug: "fathers-day",
    type: 'fixed',
    name: "F\u00eate des P\u00e8res",
    category: "Holidays",
    description: "Compte \u00e0 rebours pour la F\u00eate des P\u00e8res. La date varie selon le pays.",
    pageUrl: "https://countdowns.site/fr/countdown/fathers-day/"
  };
  function nextDate(dates) {
    var now = new Date();
    for (var i = 0; i < dates.length; i++) {
      if (new Date(dates[i]) > now) return new Date(dates[i]);
    }
    return new Date(dates[dates.length - 1]);
  }
  CountdownEngine.renderEmbed('root', Object.assign({}, _cfg, { date: nextDate(VARIANTS[DEFAULT_IDX].dates) }));
})();
</script>
</body>
</html>
