<div class="cd-article">
  <p class="cd-article-body">Le Jour de la Liberté (Freedom Day) est célébré le 27 avril en Afrique du Sud et commémore les premières élections démocratiques et multiraciales de 1994.</p>
  <div class="cd-faq"><h2 class="cd-faq-title">Questions Fréquentes</h2><div class="cd-faq-item"><h3 class="cd-faq-q">Quand est le Jour de la Liberté en Afrique du Sud ?</h3><p class="cd-faq-a">Le 27 avril de chaque année.</p></div></div>

<script src="/countdown-engine.js"></script>
<script>
CountdownEngine.render('root', {
  slug: "freedom-day-za",
  type: "auto",
  name: "Jour de la Libert\u00e9 (Afrique du Sud)",
  category: "National Days",
  description: "Compte \u00e0 rebours jusqu'au Jour de la Libert\u00e9 d'Afrique du Sud."
});
// ── Theme toggle ──────────────────────────────────────────────────────
(function() {
  var btn = document.getElementById('theme-toggle');
  var saved = localStorage.getItem('cd_theme');
  if (saved === 'light') { document.documentElement.setAttribute('data-theme', 'light'); btn.textContent = 'Dark'; }
  btn.addEventListener('click', function() {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('cd_theme', 'dark');
      btn.textContent = 'Light';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('cd_theme', 'light');
      btn.textContent = 'Dark';
    }
  });
})();
// ── Country flag ──────────────────────────────────────────────────────
(function(){
  var fb=document.getElementById('country-flag-btn');
  if(!fb)return;
  var saved=typeof localStorage!=='undefined'?localStorage.getItem('cd_country'):null;
  if(saved&&CountdownEngine.FLAG_MAP)fb.textContent=CountdownEngine.FLAG_MAP[saved]||'🌍';
  fb.addEventListener('click',function(){
    CountdownEngine.openCountryPicker(function(code){
      localStorage.setItem('cd_country',code);
      location.reload();
    });
  });
})();
</script>
